name: Suggest an idea
description: A place, a kind of weather, a feature, or a better way to explain something.
title: "Idea: "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: Thank you. Please don't include personal details; this page is public.
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: who
    attributes:
      label: Who would it help, and how?
      description: For example, a teacher, a farmer, an emergency manager.
